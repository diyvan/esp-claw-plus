version: 1.0.0
# Devices Configuration for Waveshare ESP32-P4-WIFI6-Touch-LCD-3.5
# 引脚来源: Waveshare BSP waveshare__esp32_p4_wifi6_touch_lcd_3_5 v2.0.2
# (examples/esp-idf/06_I2SCodec 与 11_esp_brookesia_phone 已真机验证)
devices:
  # Audio DAC via ES8311 codec
  - name: audio_dac
    chip: es8311
    type: audio_codec
    version: default
    config:
      dac_enabled: true
      dac_max_channel: 2
      dac_channel_mask: "11"  # Enable both left and right channels
      mclk_enabled: true

    peripherals:
      - name: gpio_pa_control
        gain: 6
        active_level: 1

      - name: i2s_audio_out
      - name: i2c_master
        address: 0x30              # ES8311 7-bit: 0x18, board_manager 用 8-bit: 0x18<<1=0x30

  # Audio ADC via ES8311 codec (板载贴片麦克风)
  - name: audio_adc
    chip: es8311
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      adc_max_channel: 2
      adc_channel_mask: "11"  # Enable both left and right channels
      adc_channel_labels: [MIC]
      mclk_enabled: true

    peripherals:
      - name: i2s_audio_in
      - name: i2c_master
        address: 0x30              # ES8311 7-bit: 0x18, board_manager 用 8-bit: 0x18<<1=0x30

  # SD Card (MicroSD, SDMMC Slot 0, 片上 LDO 通道 4 供电, 与 p4_nano 引脚一致)
  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    version: default
    config:
      sub_config:
        slot: SDMMC_HOST_SLOT_0
        frequency: SDMMC_FREQ_HIGHSPEED
        bus_width: 4
        pins:
          clk: 43
          cmd: 44
          d0: 39
          d1: 40
          d2: 41
          d3: 42
        ldo_chan_id: 4

  # Buttons (GPIO-based, active low)
  # BOOT 按键接 P4 strapping 引脚 GPIO35; RST 为硬件复位, 非 GPIO。
  # PWR 按键经 BSS138 电平转换接到 GPIO49, 高电平有效(按下=1); AXP2101 的
  # PWRON 与它并联, 长按 6s 由 PMIC 直接关机。GPIO49 由 ha_panel 轮询做待机开关,
  # 本设备条目保持 init_skip 不接管(避免与 ha_panel 抢同一个引脚)。
  - name: buttons
    chip: gpio_button
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      button_boot_gpio: 35   # BOOT 按键
      active_level: 0

  # === M1: 显示与触摸 ===
  # 参数取自 Waveshare BSP v2.0.2 (esp32_p4_wifi6_touch_lcd_3_5.c):
  #   80MHz SPI mode3 / BGR / RGB565 BIGENDIAN / invert_color / mirror(true,false)
  - name: display_lcd
    chip: st7796
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      espressif/esp_lcd_st7796: "*"
    config:
      mirror_x: true
      mirror_y: false
      swap_xy: false
      invert_color: true
      x_max: 320
      y_max: 480
      io_spi_config:
        cs_gpio_num: 23
        dc_gpio_num: 26
        spi_mode: 3
        pclk_hz: 80000000
      lcd_panel_config:
        reset_gpio_num: 27
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_BGR
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        bits_per_pixel: 16
    peripherals:
      - name: spi_display

  # 背光亮度 (LEDC PWM)
  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - name: ledc_backlight

  # FT6336 电容触摸 (FT5x06 家族驱动), 与 ES8311 共用 i2c_master
  # BSP 中触摸不做 swap/mirror; 7-bit 地址 0x38, board_manager 用 8-bit=0x70
  - name: lcd_touch
    chip: ft5x06
    type: lcd_touch
    sub_type: i2c
    depends_on: display_lcd
    version: default
    dependencies:
      espressif/esp_lcd_touch: "*"
      espressif/esp_lcd_touch_ft5x06: "^1.0.0"
    config:
      io_i2c_config:
        lcd_cmd_bits: 8
        flags:
          disable_control_phase: true
      touch_config:
        x_max: 320
        y_max: 480
        rst_gpio_num: 29
        int_gpio_num: 50
    peripherals:
      - name: i2c_master
        i2c_addr: [0x70]
